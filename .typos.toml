[files]
ignore-hidden = true
ignore-files = true
ignore-dot = true
ignore-vcs = true
ignore-global = true
ignore-parent = true
extend-exclude = []

[default]
binary = false
check-filename = true
check-file = true
unicode=true
locale = "en"
extend-ignore-re = []

[default.extend-identifiers]
# whole-token allowlist ( checked before word-splitting; avoids 'OTFs' -> 'OT' )
OTFs = 'OTFs'

[default.extend-words]
# <typo> = "<correction>"
Accademia = 'Accademia'
